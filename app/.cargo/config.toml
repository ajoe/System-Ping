# The MSVC Build Tools (winget install Microsoft.VisualStudio.2022.BuildTools) are the
# toolchain now: rustup's default host is `stable-x86_64-pc-windows-msvc`, so a plain
# `cargo build` uses cl.exe/link.exe and needs no override here.

# Only one entry, and it is a workaround for an upstream quirk: linking `ring` under MSVC
# prints "warning: C4244 ...", which sounds serious but comes from generated assembly that
# the crate itself cannot avoid. Silencing it keeps `cargo build` output clean enough to
# notice the warnings that do matter. Deleting this file changes nothing about the build —
# the warning just comes back.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/IGNORE:4244"]
