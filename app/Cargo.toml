[package]
name = "system-ping"
version = "0.1.0"
edition = "2021"
description = "Reicht Ping-Antworten in ein Live-Diagramm."
license = "MIT"

[dependencies]
# GUI: eframe/egui (glow-Backend, eigene Software-Rasterung fuer Screenshots).
#
# The crate builds for Windows, Linux and macOS. `default-features = false` is deliberate:
# eframe's defaults add the wgpu renderer, OS accessibility (accesskit_winit), a web screen
# reader, persisted window state and system-font lookup — none of which this app uses, and all of
# them platform code that has to build on every OS. `glow` keeps one renderer on every OS — no
# Metal or Vulkan backend to get right per platform. The display back ends (wayland/x11) matter on
# Linux only; Windows and macOS ignore them, so listing them costs nothing there and keeps one
# feature list for all three instead of a table of cfg-specific variants.
#
# `clipboard` is in the list on purpose: without it egui-winit has no clipboard, and Ctrl+C/Ctrl+V
# in the host field would silently do nothing. It is off in eframe's defaults only for the web.
#
# Note that the plain `accesskit` crate (data types for accessibility, no OS bridge) is a
# mandatory dependency of egui itself since 0.37 and cannot be switched off; only the bridge that
# hands a tree to the screen reader is behind the `accesskit` feature, which stays off.
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zeitstempel fuer Protokoll/CSV: nur clock+std, ohne zh-lc_time (das zieht icu_* nach
# sich - und ein einziger Build-Linkfehler dort stoppt sonst den ganzen Aufbau).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The "save as…" dialog. On Windows it uses the native one, on macOS AppKit, and on Linux the
# freedesktop portal over D-Bus — which needs no GTK installation, so a plain headless-ish distro
# still gets a dialog. Exactly one of gtk3/gtk4/xdg-portal must be on for a Unix build (rfd's
# build script insists), hence xdg-portal here and `default-features = false`.
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.build-dependencies]
# Bettet assets/icon.ico als RT_GROUP_ICON in die EXE ein, damit der Explorer ein echtes
# Datei-Symbol zeigt (nicht nur das Fenster- und Taskleisten-Symbol aus main.rs).
winresource = "0.1"

[profile.release]
opt-level = 2

# Panics abort instead of unwinding: a smaller, simpler binary, and the fallback
# GNU toolchain (see .cargo/config.toml.bak) has no usable unwinder. `--release` is
# also what the app is used with; a debug build gets the same setting through
# .cargo/config.toml.
panic = "abort"
