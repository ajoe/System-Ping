[package]
name = "system-ping"
version = "0.1.0"
edition = "2021"
description = "Reicht Ping-Antworten in ein Live-Diagramm."
license = "MIT"

[dependencies]
# GUI: eframe/egui (glow-Backend, eigene Software-Rasterung fuer Screenshots).
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Zeitstempel fuer Protokoll/CSV: nur clock+std, ohne zh-lc_time (das zieht icu_* nach
# sich - und ein einziger Build-Linkfehler dort stoppt sonst den ganzen Aufbau).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.18.0", default-features = false }

[build-dependencies]
# Bettet assets/icon.ico als RT_GROUP_ICON in die EXE ein, damit der Explorer ein echtes
# Datei-Symbol zeigt (nicht nur das Fenster- und Taskleisten-Symbol aus main.rs).
winresource = "0.1"

[profile.release]
opt-level = 2

# Panics abort instead of unwinding: a smaller, simpler binary, and the fallback
# GNU toolchain (see .cargo/config.toml.bak) has no usable unwinder. `--release` is
# also what the app is used with; a debug build gets the same setting through
# .cargo/config.toml.
panic = "abort"
