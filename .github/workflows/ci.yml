# Gates for every push and pull request: formatting, lints, tests, and one build per operating
# system. The three systems are here on purpose — everything platform specific lives in
# app/src/platform/, and a check that only ever runs on one of them cannot tell whether a change
# to that folder kept the other two working.
#
# The release artefacts themselves are built by release.yml, which is what runs on a tag. One of
# them — the macOS bundle — is built here as well and uploaded as an artefact of the run, so the
# shape a user double-clicks is tested by every push and not by a tag alone.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows and Linux build and test the whole workspace, including the headless gui tests.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # The system libraries eframe binds against, same list as in the README — plus the two
            # runtime packages that only show up when a window is actually painted: without
            # libxkbcommon-x11 winit stops at "Library libxkbcommon-x11.so could not be loaded",
            # which the compile and the headless tests never notice.
            apt: >-
              pkg-config libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev
              libxrandr-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dri
              libegl1 libglx-mesa0 xvfb
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            apt: ""
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # The steps below are bash scripts (`if [ … ]`, `case`, `test -s`). On a Windows runner the
    # default shell is PowerShell, which reads those lines as its own language and stops at the
    # second character — so the shell is said out loud instead of left to the runner.
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --no-fail-fast

      # The same smoke test the release job uses, asking each system what that machine can answer.
      # Linux and macOS paint one frame and write it out: the file loads, gets a window, renders.
      # A Windows build machine cannot — its only display is the basic render driver, which offers
      # no OpenGL 2.0, and egui_glow stops there for a reason that has nothing to do with this
      # program. So Windows asks the command line instead (the whole binary has to be loaded for an
      # answer), and the tests above have already painted every widget through egui's own software
      # painter, which needs no driver at all. The explicit target is the one the release artefacts
      # are built for, so CI covers that triple and not just whatever the runner is.
      #
      # `SYSTEM_PING_STATE_DIR` points the run at an empty folder on purpose: the picture should show
      # the built-in targets, not what the test suite happened to leave in the machine's state file.
      # It did leave something there, one row, and the seeded picture asked for a second one.
      - name: Smoke test (paint one frame)
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}
          bin=target/${{ matrix.target }}/release/system-ping
          export SYSTEM_PING_STATE_DIR="$(mktemp -d)"
          case "${{ runner.os }}" in
            Windows)
              "$bin.exe" --help >help.txt
              test -s help.txt
              grep -q -- "--shot" help.txt
              ;;
            Linux)
              xvfb-run -a "$bin" --shot smoke.png chart
              test -s smoke.png
              ;;
            *)
              "$bin" --shot smoke.png chart
              test -s smoke.png
              ;;
          esac

  # macOS: the cheap gates only. The integration tests that drive a real window are covered here
  # by the release job and by development machines; a headless CI runner has no window server
  # session to attach to, and pretending otherwise would just make the run red for no reason.
  macos-checks:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

  # The macOS bundle — the double-clickable program without a terminal window — is built here too,
  # on every push, and handed up as an artefact of the run. Before this step the shape existed only
  # at release time (release.yml asks `bundle.sh` for it), which meant a broken `Info.plist` or a
  # missing `assets/icon.png` was something a release discovered first.
  #
  # It is a job of its own, and it waits for the gates above: a tree that does not pass formatting
  # or Clippy has no artefact worth downloading. The release build it needs is the same one
  # `bundle.sh` would run on a machine, and rust-cache carries it from the next run on.
  macos-bundle:
    runs-on: macos-latest
    needs: macos-checks
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Build the bundle
        run: ./macos/bundle.sh

      # The bundle is checked as a bundle, not as a file that happens to be in a folder: the
      # property list has to parse and name this version (Finder calls a folder with an unreadable
      # plist "cannot be opened" and says nothing else), the signature has to cover the folder
      # rather than leave a signed file inside an unsigned one, and the program inside has to paint
      # — the same question `--shot` asks of the bare binary, now asked through the shape a user
      # actually double-clicks.
      - name: Check the bundle
        run: |
          app=target/macos/System-Ping.app
          plutil -lint "$app/Contents/Info.plist"
          v=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$v"
          codesign --verify --strict "$app"
          export SYSTEM_PING_STATE_DIR="$(mktemp -d)"
          "$app/Contents/MacOS/system-ping" --shot bundle-chart.png chart
          test -s bundle-chart.png

      # Zipped by `ditto`, exactly as the release job does it — and not uploaded as a loose folder
      # because an artefact's own zip format drops the executable bit, which would hand back a
      # bundle whose program cannot be started.
      - name: Pack
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --sequesterRsrc --keepParent target/macos/System-Ping.app \
            "System-Ping-$v-macos-arm64.zip"
          ls -l "System-Ping-$v-macos-arm64.zip"

      # Shorter than the default retention on purpose: this is a look-alike of the release file for
      # trying things out, and the file that stays is the one on the release.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: app/System-Ping-*-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error
